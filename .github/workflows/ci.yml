name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Content (schema, cross-references, both pathways)
        run: npm run content:validate
      - name: JSON Schemas match the content model
        run: npm run content:schema -- --check
      - name: AET alignment document is up to date
        run: npm run docs:aet -- --check
      - name: Consent scripts document is up to date
        run: npm run docs:consent -- --check
      - name: Audio recording manifest is up to date
        run: npm run audio:manifest -- --check
      - run: npm test

  integration:
    name: Database, end-to-end and performance
    runs-on: ubuntu-latest
    needs: checks
    # Headroom for slow package mirrors on the runner (apt for the browser).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (no paid services; data is thrown away)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - run: npm run env:local
      - name: Build without ffmpeg, as Vercel does (placeholder audio is committed)
        run: |
          npm run build
          test -z "$(git status --porcelain -- public/audio/placeholder)" || { git status --short -- public/audio/placeholder | head -20; echo "Commit public/audio/placeholder (npm run content:build with ffmpeg)"; exit 1; }
      - name: Seed curriculum and development staff accounts
        run: |
          npm run db:seed-content
          npm run db:seed-dev
      - name: Row-level security and database functions
        run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (360x640, both languages, offline, slow network, accessibility)
        run: npx playwright test
      - name: Performance budgets (Lighthouse)
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          npx --yes wait-on@8.0.1 http://127.0.0.1:3000/api/health
          npm run perf:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            reports/lighthouse/
          retention-days: 14
